<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NovaSearch - Explore the Web</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: Arial, sans-serif;
                background: #f8fafc;
                color: #172033;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 20px;
                transition: 0.3s;
            }

            body.dark {
                background: #111827;
                color: white;
            }

            .theme {
                position: absolute;
                top: 20px;
                right: 25px;
                padding: 10px;
                cursor: pointer;
            }

            h1 {
                font-size: clamp(42px, 9vw, 65px);
                margin-bottom: 10px;
                letter-spacing: -3px;
            }

            h1 span {
                color: #2563eb;
            }

            p {
                color: #64748b;
            }

            .search-box {
                display: flex;
                width: min(600px, 100%);
                border: 1px solid #cbd5e1;
                border-radius: 40px;
                padding: 8px 15px;
                background: white;
                margin-top: 25px;
            }

            .dark .search-box {
                background: #1f2937;
                border-color: #475569;
            }

            input {
                flex: 1;
                min-width: 0;
                border: none;
                outline: none;
                padding: 12px;
                font-size: 16px;
                background: transparent;
                color: inherit;
            }

            button {
                border: none;
                border-radius: 25px;
                padding: 12px 20px;
                background: #2563eb;
                color: white;
                cursor: pointer;
            }

            button:hover {
                background: #1d4ed8;
            }

            .options {
                display: flex;
                gap: 12px;
                margin-top: 20px;
            }

            #results {
                width: min(600px, 100%);
                margin-top: 30px;
                overflow-wrap: anywhere;
            }

            .result {
                padding: 15px;
                border-radius: 12px;
                background: white;
                border: 1px solid #e2e8f0;
                margin-top: 12px;
            }

            .dark .result {
                background: #1f2937;
                border-color: #475569;
            }
        </style>
    </head>

    <body>

        <button class="theme" onclick="toggleTheme()">
            🌙 Theme
        </button>

        <h1>Nova<span>Search</span></h1>

        <p>Explore the web. Understand more.</p>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search anything..."
                onkeydown="if(event.key==='Enter') searchWeb()">

            <button onclick="searchWeb()">Search</button>
        </div>

        <div class="options">
            <button onclick="searchWeb()">Web Search</button>
            <button onclick="aiSearch()">AI Search</button>
        </div>

        <div id="results"></div>

        <script>
            async function searchWeb() {
                const query = document
                    .getElementById("searchInput")
                    .value.trim();

                const results = document.getElementById("results");

                if (!query) {
                    results.textContent = "Please enter a search query.";
                    return;
                }

                results.textContent = "Searching...";

                try {
                    const response = await fetch(
                        `/api/search?q=${encodeURIComponent(query)}`
                    );

                    if (!response.ok) {
                        throw new Error("Search request failed");
                    }

                    const data = await response.json();

                    results.replaceChildren();

                    const card = document.createElement("div");
                    card.className = "result";

                    const heading = document.createElement("h3");
                    heading.textContent = data.query;

                    const message = document.createElement("p");
                    message.textContent = data.message;

                    const status = document.createElement("p");
                    status.textContent = "Status: " + data.status;

                    card.append(heading, message, status);
                    results.appendChild(card);

                } catch (error) {
                    results.textContent =
                        "Unable to connect to NovaSearch backend.";
                }
            }

            function aiSearch() {
                alert("AI Search will be added in a future phase!");
            }

            function toggleTheme() {
                document.body.classList.toggle("dark");
            }
        </script>

    </body>

</html>
